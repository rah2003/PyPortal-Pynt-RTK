; PyPortal-Pynt-RTK — PlatformIO environments
;
; pynt-bringup : Phase 1 bench test suite (serial menu; see
;                firmware/pynt/bringup/main_bringup.cpp and
;                docs/hardware/checklists.md)
; pynt-rover   : Phase 2 Rover firmware (NTRIP -> RTCM3 -> F9P UART1,
;                RAWX logging, touch UI, SW Maps TCP)
;
; WiFi+BLE coexistence branch (docs/coex-bench.md; needs the custom
; nina-fw 3.0.1-airlift flashed on the target's ESP32):
; metro-spike-wifi   : Spike A — upstream WiFiNINA 2.x smoke test, Metro M4
; metro-spike-coex   : Spike B — WiFi + BLE simultaneously, Metro M4
; feather-soak-coex  : Spike C — SD+WiFi+BLE shared-SPI soak, Feather M0
;                      Adalogger + AirLift FeatherWing
; pynt-rover-coex    : rover built against the upstream stack (compile
;                      gate now, hardware gate AFTER the spikes pass —
;                      do not flash the assembled Pynt before that)
; passthrough-*      : Serial<->NINA bridge for esptool (metro/feather/pynt)

[platformio]
src_dir = firmware
default_envs = pynt-bringup

[env:pynt-bringup]
platform = atmelsam
board = adafruit_pyportal_m4
framework = arduino
monitor_speed = 115200
build_src_filter = +<pynt/bringup/>
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ILI9341@^1.6.1
    adafruit/Adafruit TouchScreen@^1.1.5
    ; Adafruit fork (adds WiFi.setPins for AirLift) — not in the PIO
    ; registry, pinned to a commit-ish branch from GitHub:
    WiFiNINA=https://github.com/adafruit/WiFiNINA.git
    greiman/SdFat@^2.2.3
    adafruit/Adafruit BusIO@^1.16.2

[env:pynt-rover]
platform = atmelsam
board = adafruit_pyportal_m4
framework = arduino
monitor_speed = 115200
build_src_filter = +<pynt/rover/>
build_flags =
    ; SERCOM RX ring: rides out WiFiNINA's blocking WiFi.begin() windows
    ; at the F9P's ~2.5 kB/s actual rate. Bench-measured joins run ~10.9 s
    ; (2026-07-19 soak, twice), not the ~4 s first assumed — 32 KiB covers
    ; ~13 s so a mid-session rejoin no longer gaps the RAWX stream.
    -DSERIAL_BUFFER_SIZE=32768
    ; newlib-nano omits %f from printf-family by default; the UI formats
    ; lat/lon with snprintf("%.7f") — without this it prints empty.
    -Wl,-u,_printf_float
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ILI9341@^1.6.1
    adafruit/Adafruit TouchScreen@^1.1.5
    WiFiNINA=https://github.com/adafruit/WiFiNINA.git
    greiman/SdFat@^2.2.3 
    adafruit/Adafruit BusIO@^1.16.2
    sparkfun/SparkFun u-blox GNSS v3@^3.1.9

; ---------------------------------------------------------------------------
; WiFi + BLE coexistence (branch coex/nina-fw-airlift). Upstream host stack:
;   WiFiNINA 2.1.1 (git tag pin) + vendored lib/Arduino_SpiNINA 0.0.2 +
;   vendored lib/ArduinoBLE 2.1.0 (2-line gate patch, -DBLE_NINA_SPI_TRANSPORT).
; Module side: firmware/nina-fw-airlift (arduino/nina-fw 3.0.1, MOSI 12->14).
; The pynt-rover/pynt-bringup envs above stay on the Adafruit fork — fallback.

[coex]
lib_deps_upstream =
    WiFiNINA=https://github.com/arduino-libraries/WiFiNINA.git#2.1.1

[env:metro-spike-wifi]
platform = atmelsam
board = adafruit_metro_m4_airliftlite
framework = arduino
monitor_speed = 115200
build_src_filter = +<spike/metro_wifi/>
lib_deps = ${coex.lib_deps_upstream}

[env:metro-spike-coex]
platform = atmelsam
board = adafruit_metro_m4_airliftlite
framework = arduino
monitor_speed = 115200
build_src_filter = +<spike/metro_coex/>
build_flags = -DBLE_NINA_SPI_TRANSPORT
lib_deps = ${coex.lib_deps_upstream}

[env:feather-soak-coex]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200
build_src_filter = +<spike/feather_soak/>
build_flags =
    -DBLE_NINA_SPI_TRANSPORT
    ; AirLift FeatherWing pins — the feather_m0 variant defines none of
    ; the SPIWIFI/NINA macros. GPIO0 (pin 10) needs the Wing's solder
    ; jumper CLOSED: WiFiNINA 2.x polls it as the data-ready IRQ.
    -DSPIWIFI_SS=13
    -DSPIWIFI_ACK=11
    -DSPIWIFI_RESET=12
    -DNINA_GPIO0=10
lib_deps =
    ${coex.lib_deps_upstream}
    greiman/SdFat@^2.2.3

[env:pynt-rover-coex]
; Same source as pynt-rover, upstream WiFi stack. COMPILE GATE ONLY until
; the Metro + Feather spikes pass — the assembled Pynt keeps its stock
; AirLift firmware and the pynt-rover env until then (docs/coex-bench.md).
platform = atmelsam
board = adafruit_pyportal_m4
framework = arduino
monitor_speed = 115200
build_src_filter = +<pynt/rover/>
build_flags =
    ; match pynt-rover: 32 KiB rides out the bench-measured ~10.9 s
    ; WiFi.begin() windows (2026-07-19 soak) without gapping RAWX
    -DSERIAL_BUFFER_SIZE=32768
    -Wl,-u,_printf_float
    ; upstream WiFiNINA has no setPins(); pins come from pyportal_m4
    ; variant macros (identical values) — guard in ntrip.cpp:
    -DCOEX_UPSTREAM_NINA
    -DBLE_NINA_SPI_TRANSPORT
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ILI9341@^1.6.1
    adafruit/Adafruit TouchScreen@^1.1.5
    ${coex.lib_deps_upstream}
    greiman/SdFat@^2.2.3
    adafruit/Adafruit BusIO@^1.16.2
    sparkfun/SparkFun u-blox GNSS v3@^3.1.9

; ---- esptool passthrough bridges (docs/coex-bench.md section 3) ----

[env:passthrough-metro]
platform = atmelsam
board = adafruit_metro_m4_airliftlite
framework = arduino
monitor_speed = 115200
build_src_filter = +<spike/passthrough/>

[env:passthrough-feather]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
monitor_speed = 115200
build_src_filter = +<spike/passthrough/>
build_flags =
    -DSPIWIFI_SS=13
    -DNINA_GPIO0=10
    -DNINA_RESETN=12

[env:passthrough-pynt]
; LOCKED by procedure: flash the Pynt's AirLift only after Spikes A-C pass
; (docs/coex-bench.md section 7). Take the esptool read_flash backup first.
platform = atmelsam
board = adafruit_pyportal_m4
framework = arduino
monitor_speed = 115200
build_src_filter = +<spike/passthrough/>
